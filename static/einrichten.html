<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einrichtung — E-Rechnungssystem</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0D3A5C 0%, #1B4B82 60%, #00A0D2 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 40px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.25); }
  h1 { font-size: 22px; font-weight: 800; color: #0D3A5C; text-align: center; }
  .unter { font-size: 13px; color: #64748B; text-align: center; margin: 4px 0 24px; }
  .hinweis { font-size: 13px; color: #374151; background: #F1F5F9; border-radius: 8px; padding: 12px 14px;
    margin-bottom: 20px; line-height: 1.5; }
  .hinweis code { font-family: Consolas, monospace; background: #E2E8F0; padding: 1px 5px; border-radius: 4px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 14px; border: 1.5px solid #D1D5DB; border-radius: 8px; font-size: 15px;
    color: #111827; outline: none; margin-bottom: 16px; }
  input:focus { border-color: #00A0D2; }
  button { width: 100%; padding: 12px; background: linear-gradient(135deg, #1B4B82, #00A0D2); color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .error { background: #FEE2E2; border: 1px solid #FECACA; border-radius: 8px; padding: 10px 14px;
    font-size: 13px; color: #DC2626; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>Erste Einrichtung</h1>
  <p class="unter">E-Rechnungssystem · Serverbetrieb</p>
  <div class="hinweis">
    Legen Sie das erste Benutzerkonto an. Den <strong>Einrichtungscode</strong> zeigt das
    Programm beim Start in der Konsole bzw. im Protokoll an. Er steht außerdem in
    <code>data/einrichtungscode.txt</code> im Installationsordner.
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST" action="/einrichten" autocomplete="off">
    <label for="code">Einrichtungscode</label>
    <input type="text" id="code" name="code" placeholder="XXXX-XXXX-XXXX" required autofocus>
    <label for="username">Benutzername</label>
    <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required minlength="3">
    <label for="password">Passwort (mindestens 8 Zeichen)</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
    <label for="password2">Passwort wiederholen</label>
    <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8">
    <button type="submit">Konto anlegen und anmelden</button>
  </form>
</div>
</body>
</html>
